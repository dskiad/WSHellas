name: Apply final officer vest background
on:
  push:
    paths:
      - '.github/workflows/apply-final-officer-vest-bg.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: officer-vest-bg-update
      - name: Apply vest image behind officer duties
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = r'''
<style id="officer-vest-photo-background-final">
/* Exact leather vest image behind officer duties */
#administration .vest-back,
#administration .vest,
.officers-vest-2026 .vest-back,
.officers-vest-2026 .vest,
body .officer .vest {
  position: relative !important;
  background-image:
    linear-gradient(rgba(0,0,0,.10),rgba(0,0,0,.10)),
    url('assets/officers-vest-bg.jpg') !important;
  background-color: transparent !important;
  background-position: center top !important;
  background-repeat: no-repeat !important;
  background-size: contain !important;
  clip-path: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  filter: drop-shadow(0 18px 20px rgba(0,0,0,.46)) !important;
  min-height: 500px !important;
  aspect-ratio: 1229 / 1536;
  overflow: visible !important;
  padding: 145px 46px 78px !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
}
#administration .vest-back::before,
#administration .vest-back::after,
#administration .vest::before,
#administration .vest::after,
.officers-vest-2026 .vest-back::before,
.officers-vest-2026 .vest-back::after,
body .officer .vest::before,
body .officer .vest::after,
body .officer .vest .seam {
  display:none !important;
}
#administration .vest-duty,
#administration .vest p,
.officers-vest-2026 .vest-duty,
body .officer .vest p {
  position: relative !important;
  z-index: 3 !important;
  width: min(78%, 285px) !important;
  max-width: 285px !important;
  margin: 16px auto 0 !important;
  padding: 14px 15px !important;
  background: rgba(0,0,0,.38) !important;
  border: 1px solid rgba(255,255,255,.10) !important;
  border-radius: 6px !important;
  color: #f0ece4 !important;
  text-shadow: 0 1px 2px #000 !important;
  line-height: 1.52 !important;
  box-shadow: 0 8px 18px rgba(0,0,0,.18) !important;
}
#administration .vest-duty > span,
.officers-vest-2026 .vest-duty > span,
body .officer .vest-role {
  position: relative !important;
  z-index: 4 !important;
  color: #d8b76d !important;
  text-shadow: 0 1px 3px #000 !important;
}
#administration .vest-nameplate,
.officers-vest-2026 .vest-nameplate,
body .officer .nameplate {
  position: relative !important;
  z-index: 5 !important;
  margin-top: -12px !important;
}
@media(max-width:700px){
  #administration .vest-back,
  #administration .vest,
  .officers-vest-2026 .vest-back,
  .officers-vest-2026 .vest,
  body .officer .vest {
    min-height: 470px !important;
    padding: 132px 34px 68px !important;
  }
  #administration .vest-duty,
  #administration .vest p,
  .officers-vest-2026 .vest-duty,
  body .officer .vest p {
    width: 80% !important;
    font-size: 14px !important;
  }
}
</style>
'''

          for filename in ('index.html','officers.html'):
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<style id="officer-vest-photo-background-final">.*?</style>\s*', '', s, flags=re.S)
              if '</head>' not in s:
                  raise SystemExit(f'</head> not found in {filename}')
              s = s.replace('</head>', css + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')

          # Remove temporary workflow after it has done its job.
          wf = Path('.github/workflows/apply-final-officer-vest-bg.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit and push styling
        run: |
          git config user.name "Dimitrios Skiadopoulos"
          git config user.email "grand.chancellor@nglgreece.gr"
          git add -A
          git commit -m "Use leather vest image behind officer duty descriptions"
          git push origin HEAD:officer-vest-bg-update