name: Apply final officer vest background
on:
  push:
    paths:
      - '.github/workflows/apply-final-officer-vest-bg.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Link vest background stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag = '<link rel="stylesheet" href="assets/officer-vest-background.css?v=20260906">'
          for name in ('index.html', 'officers.html'):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              if tag not in s:
                  s = s.replace('</head>', tag + '\n</head>', 1)
                  p.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-final-officer-vest-bg.yml').unlink(missing_ok=True)
          PY
      - name: Commit and push
        run: |
          git config user.name "Dimitrios Skiadopoulos"
          git config user.email "grand.chancellor@nglgreece.gr"
          git add -A
          git commit -m "Show leather vest behind officer duty descriptions"
          git push origin HEAD:claude/repo-push-vfylka