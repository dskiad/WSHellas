name: Apply final officers vest graph
on:
  push:
    paths:
      - '.github/workflows/apply-final-officers-vest-graph.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Replace officers section with vest graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html, re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          officers = [
            ('President','Πρόεδρος','Dimitrios Skiadopoulos','Ηγείται συνολικά του Chapter και έχει την ανώτατη ευθύνη για τη λειτουργία και την κατεύθυνσή του. Προεδρεύει των συνεδριάσεων, οργανώνει και κατευθύνει τις δραστηριότητες, εκπροσωπεί επίσημα το Chapter και μεριμνά για την πιστή εφαρμογή του Καταστατικού, του Εσωτερικού Κανονισμού και των αποφάσεων του Chapter.','founder'),
            ('Vice President','Αντιπρόεδρος','Dimitrios Panagakos','Είναι ο δεύτερος στην ιεραρχία και ο άμεσος συνεργάτης του Προέδρου. Υποστηρίζει τον Πρόεδρο στην άσκηση των καθηκόντων του και τον αναπληρώνει πλήρως σε κάθε απουσία ή κώλυμά του. Συνοδεύει τον Πρόεδρο στις επίσημες εκδηλώσεις και συνδράμει στον συντονισμό της διοίκησης του Chapter.','principal'),
            ('Secretary','Γραμματέας','Nikolaos Markopoulos','Είναι υπεύθυνος για τη διοικητική λειτουργία του Chapter. Τηρεί τα πρακτικά, το μητρώο των μελών, το διοικητικό αρχείο, την επίσημη αλληλογραφία και τις προβλεπόμενες αναφορές. Όλα τα επίσημα έγγραφα του Chapter φέρουν υποχρεωτικά τη σφραγίδα και αποκλειστικά την υπογραφή του Γραμματέα. Μόνο ο Γραμματέας υπογράφει τις κάρτες μελών του Chapter.','principal'),
            ('Treasurer','Ταμίας','Panagiotis Vlahos','Έχει την ευθύνη της οικονομικής διαχείρισης του Chapter. Διαχειρίζεται τους τραπεζικούς λογαριασμούς, τις συνδρομές, τις εισπράξεις και τις πληρωμές, τηρεί τα οικονομικά βιβλία και τα σχετικά παραστατικά και παρουσιάζει τα προβλεπόμενα οικονομικά στοιχεία και τις αναφορές προς τη διοίκηση.','principal'),
            ('Sergeant-at-Arms','Υπεύθυνος Τάξης','Marinos Andreas','Είναι υπεύθυνος για την εσωτερική τάξη, την πειθαρχία και την τήρηση των Κανονισμών και των αποφάσεων του Chapter. Επιβλέπει την ορθή συμπεριφορά των μελών, αντιμετωπίζει παραβάσεις ή ζητήματα πειθαρχίας και, όταν απαιτείται, τα αναφέρει και τα κλιμακώνει προς τον Πρόεδρο.','principal'),
            ('Road Captain','Αρχηγός Αποστολής','Panagiotis Floris','Έχει την κύρια ευθύνη για όλες τις οργανωμένες μοτοσικλετιστικές διαδρομές και αποστολές. Σχεδιάζει τη διαδρομή, τα σημεία στάσης και την πορεία, οργανώνει και ελέγχει τον σχηματισμό και τη μοτοσικλετιστική στήλη και μεριμνά για την πειθαρχία, την ασφάλεια και την ομαλή κίνηση της ομάδας στον δρόμο.','principal'),
            ('Road Sergeant','Ομαδάρχης','Προς ορισμό','Υποστηρίζει άμεσα τον Road Captain κατά τις οργανωμένες διαδρομές και αποστολές. Επιβλέπει το τμήμα, την ομάδα ή τον σχηματισμό που του ανατίθεται, διατηρεί την επικοινωνία με τον Road Captain και μεριμνά για τις αποστάσεις, την πειθαρχία, τη συνοχή και την ασφάλεια των αναβατών στον δρόμο.','additional'),
            ('Warden','Έφορος Μελών & Συμμόρφωσης','George Dryllis','Παρακολουθεί τα θέματα που αφορούν τα μέλη, την ιδιότητά τους και τη συμμόρφωσή τους προς το Καταστατικό, τον Εσωτερικό Κανονισμό και τις αποφάσεις του Chapter. Επιβλέπει την ορθή χρήση του γιλέκου, των εμβλημάτων και των διακριτικών και συμβάλλει στην προστασία της περιουσίας και της ταυτότητας του Chapter.','additional'),
            ('Orator','Σύμβουλος','Andreas Tsounakos','Λειτουργεί ως σύμβουλος του Προέδρου και του Chapter. Συνδράμει στη διαμόρφωση θέσεων και επίσημων παρουσιάσεων, στην επικοινωνία, στις εκδηλώσεις και στη δημόσια εκπροσώπηση, μεριμνώντας ώστε ο λόγος και η παρουσία του Chapter να ανταποκρίνονται στις αρχές και στο κύρος του.','additional'),
            ('Ambassador','Εκπρόσωπος προς άλλα Motorcycle Clubs','Pantelis Lathiotakis','Εκπροσωπεί το Chapter στις σχέσεις του με άλλα Motorcycle Clubs, Widows Sons Chapters και συναφείς οργανώσεις. Αναπτύσσει και διατηρεί επικοινωνία, συνεργασίες και αδελφικούς δεσμούς και ενημερώνει τη διοίκηση για επαφές, προσκλήσεις και θέματα εξωτερικών σχέσεων.','additional'),
            ('Almoner','Ελεονόμος Αγαθοεργίας','Pavlos Sarof','Είναι υπεύθυνος για την αγαθοεργία, την κοινωνική μέριμνα και τη φιλανθρωπική δράση του Chapter. Παρακολουθεί περιπτώσεις αδελφών, οικογενειών ή άλλων προσώπων που χρειάζονται βοήθεια, εισηγείται τρόπους υποστήριξης και συντονίζει τις σχετικές αγαθοεργές και φιλανθρωπικές ενέργειες.','additional'),
            ('Quartermaster','Επιμελητής','Προς ορισμό','Διαχειρίζεται την περιουσία, τον εξοπλισμό και τα υλικά του Chapter. Τηρεί την ευθύνη για τα εμβλήματα, τα patches, τα διακριτικά και κάθε αντικείμενο που ανήκει ή χρησιμοποιείται από το Chapter και μεριμνά για την καταγραφή, την ορθή φύλαξη, τη διάθεση, την παράδοση και την επιστροφή τους.','additional'),
            ('Master of Ceremonies','Τελετάρχης','Alexandros Epifanis','Είναι υπεύθυνος για το τελετουργικό, το πρωτόκολλο και την επίσημη τάξη των τελετών και εκδηλώσεων του Chapter. Προετοιμάζει τη ροή του προγράμματος, καθοδηγεί τους συμμετέχοντες στις προβλεπόμενες διαδικασίες και συντονίζει την ομαλή και αξιοπρεπή διεξαγωγή κάθε επίσημης τελετής.','additional'),
            ('Preparing Brother','Δοκιμαστής','Konstantinos Karmalis','Αποτελεί βασικό αξίωμα για την εισδοχή και τη μύηση νέου μέλους. Γνωρίζει και προετοιμάζει τον υποψήφιο, τον καθοδηγεί πριν από την εισδοχή, οργανώνει και επιβλέπει τη δοκιμασία που πρέπει να περάσει πριν κριθεί κατάλληλος να γίνει Widows Son και εισηγείται προς τον Πρόεδρο και τη διοίκηση για την ολοκλήρωση της εισδοχής του.','additional'),
            ('Event Manager','Υπεύθυνος Εκδηλώσεων','Προς ορισμό','Έχει την ευθύνη για την πρακτική προετοιμασία, οργάνωση και υποστήριξη των εκδηλώσεων του Chapter. Συντονίζει τις ανάγκες χώρου, χρόνου, φιλοξενίας και λειτουργίας της εκδήλωσης και συνδράμει σε οτιδήποτε απαιτηθεί πριν, κατά τη διάρκεια και μετά την εκδήλωση για την ομαλή διεξαγωγή της.','additional'),
          ]

          def card(item, lead=False):
              en, gr, name, duty, kind = item
              classes = ['ws-officer-card', kind]
              if lead: classes.append('lead-card')
              badge = ''
              if kind == 'founder':
                  badge = '<div class="ws-founder-badge">Founding President · Ιδρυτικός Πρόεδρος &amp; Οικιστής</div>'
              vacancy = ' vacancy' if name == 'Προς ορισμό' else ''
              return f'''<article class="{' '.join(classes)}">
                <div class="ws-office-heading">
                  <div class="ws-office-en">{html.escape(en)}</div>
                  <div class="ws-office-gr">{html.escape(gr)}</div>
                  {badge}
                </div>
                <div class="ws-vest-shell">
                  <div class="ws-vest-collar"></div>
                  <div class="ws-vest-seam ws-vest-seam-left"></div>
                  <div class="ws-vest-seam ws-vest-seam-right"></div>
                  <div class="ws-vest-yoke">ΚΑΘΗΚΟΝΤΑ &amp; ΑΡΜΟΔΙΟΤΗΤΕΣ</div>
                  <div class="ws-vest-duty">{html.escape(duty)}</div>
                </div>
                <div class="ws-officer-base{vacancy}">{html.escape(name)}</div>
              </article>'''

          markup = []
          markup.append('<div class="ws-officers-vest-graph">')
          markup.append('<div class="ws-officers-summary"><span>15 Officers</span><span>6 Principal Officers</span></div>')
          markup.append('<div class="ws-leadership-row">')
          markup.append(card(officers[0], True))
          markup.append(card(officers[1], True))
          markup.append('</div>')
          markup.append('<div class="ws-group-title"><b>Κύριοι Αξιωματικοί</b><span>Principal Officers</span></div>')
          markup.append('<div class="ws-principal-grid">')
          for item in officers[2:6]: markup.append(card(item))
          markup.append('</div>')
          markup.append('<div class="ws-group-title additional-title"><b>Λοιποί Αξιωματικοί</b><span>Additional Officers</span></div>')
          markup.append('<div class="ws-additional-grid">')
          for item in officers[6:]: markup.append(card(item))
          markup.append('</div>')
          markup.append('</div>')
          new_graph = '\n'.join(markup)

          admin = s.find('<section id="administration">')
          if admin < 0:
              admin = s.find('<section id="officers">')
          if admin < 0:
              raise SystemExit('Officer/administration section not found')
          admin_end = s.find('</section>', admin)
          if admin_end < 0:
              raise SystemExit('Officer section end not found')
          section = s[admin:admin_end]

          # Normalize title and lead paragraph.
          section = re.sub(r'<h2>.*?</h2>', '<h2>Officers of the Chapter <span style="color:var(--steel);font-size:.7em;">/ Αξιωματικοί του Chapter</span></h2>', section, count=1, flags=re.S|re.I)
          lead = '<p class="lead">The Chapter is administered by <b>15 officers</b>. The first six positions constitute the <b>Principal Officers — Κύριοι Αξιωματικοί</b>. The President, Treasurer and Road Captain serve five-year terms.</p>'
          if re.search(r'<p class="lead"[^>]*>.*?</p>', section, flags=re.S|re.I):
              section = re.sub(r'<p class="lead"[^>]*>.*?</p>', lead, section, count=1, flags=re.S|re.I)
          else:
              h2end = section.find('</h2>')
              section = section[:h2end+5] + '\n' + lead + section[h2end+5:]

          starts = [x for x in [section.find('<div class="officer-grid'), section.find('<div class="officer-vest-grid'), section.find('<div class="ws-officers-vest-graph')] if x >= 0]
          if not starts:
              raise SystemExit('Existing officer grid not found')
          start = min(starts)
          # Keep any later constitutional note block if present.
          ends = [x for x in [section.find('<div class="const-offices"', start), section.find('<div class="term-note"', start)] if x >= 0]
          if ends:
              end = min(ends)
          else:
              end = len(section)
          section = section[:start] + new_graph + '\n' + section[end:]
          s = s[:admin] + section + s[admin_end:]

          css = r'''
          <style id="ws-officers-vest-graph-style">
          .ws-officers-vest-graph{margin-top:30px}
          .ws-officers-summary{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:4px 0 28px}.ws-officers-summary span{padding:7px 13px;border:1px solid rgba(198,162,92,.36);border-radius:999px;background:rgba(10,10,11,.55);font:600 10px/1 'Oswald',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#c9cdd2}
          .ws-leadership-row{display:grid;grid-template-columns:repeat(2,minmax(320px,440px));justify-content:center;gap:38px;margin:0 auto 44px}
          .ws-principal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin-top:22px}
          .ws-additional-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 28px;margin-top:22px}
          .ws-group-title{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:12px 0 0;padding:0 2px 10px;border-bottom:1px solid rgba(211,176,94,.55);color:#d7b66d}.ws-group-title b{font:700 21px/1.1 'Cinzel',serif;letter-spacing:.035em}.ws-group-title span{font:600 10px/1.1 'Oswald',sans-serif;letter-spacing:.15em;text-transform:uppercase;color:#aeb4bb}.ws-group-title.additional-title{margin-top:42px;border-color:rgba(210,214,219,.24);color:#ece9df}
          .ws-officer-card{text-align:center;position:relative;filter:drop-shadow(0 18px 22px rgba(0,0,0,.42))}.ws-office-heading{min-height:94px;padding:9px 10px 10px;display:flex;flex-direction:column;justify-content:end;align-items:center}.ws-office-en{font:700 18px/1.12 'Cinzel',serif;letter-spacing:.045em;text-transform:uppercase;color:#eef0f2;text-shadow:0 2px 7px #000}.ws-office-gr{margin-top:5px;font:600 18px/1.15 'EB Garamond',Georgia,serif;color:#c8cdd3}.ws-officer-card.principal .ws-office-en,.ws-officer-card.founder .ws-office-en{color:#dfbd73}.ws-founder-badge{margin-top:7px;padding:5px 9px;border:1px solid rgba(215,180,99,.42);border-radius:999px;font:600 8.5px/1.1 'Oswald',sans-serif;letter-spacing:.08em;color:#d6b56c;text-transform:uppercase}
          .ws-vest-shell{position:relative;min-height:455px;overflow:hidden;padding:112px 37px 42px;clip-path:polygon(18% 0,35% 0,40% 8%,45% 13%,55% 13%,60% 8%,65% 0,82% 0,100% 19%,94% 100%,6% 100%,0 19%);background:radial-gradient(ellipse at 23% 17%,rgba(255,255,255,.10),transparent 23%),radial-gradient(ellipse at 78% 44%,rgba(255,255,255,.045),transparent 28%),repeating-linear-gradient(103deg,rgba(255,255,255,.014) 0 1px,rgba(0,0,0,.018) 1px 4px),linear-gradient(100deg,#08090a 0%,#17191b 30%,#08090a 51%,#1a1c1e 70%,#08090a 100%);box-shadow:inset 0 0 0 1px rgba(235,235,235,.15),inset 0 0 35px rgba(0,0,0,.78)}
          .principal .ws-vest-shell,.founder .ws-vest-shell{background:radial-gradient(ellipse at 23% 17%,rgba(222,188,108,.13),transparent 23%),radial-gradient(ellipse at 78% 44%,rgba(255,255,255,.045),transparent 28%),repeating-linear-gradient(103deg,rgba(255,255,255,.014) 0 1px,rgba(0,0,0,.018) 1px 4px),linear-gradient(100deg,#08090a 0%,#191815 30%,#08090a 51%,#1b1915 70%,#08090a 100%)}
          .ws-vest-shell:before{content:'';position:absolute;inset:14px 17px 16px;border:1px dashed rgba(215,219,222,.18);clip-path:polygon(17% 0,34% 0,39% 8%,44% 13%,56% 13%,61% 8%,66% 0,83% 0,100% 19%,94% 100%,6% 100%,0 19%);pointer-events:none}.ws-vest-shell:after{content:'';position:absolute;left:14%;right:14%;top:86px;height:1px;background:linear-gradient(90deg,transparent,rgba(224,226,228,.28),transparent);box-shadow:0 6px 0 rgba(0,0,0,.32)}
          .ws-vest-collar{position:absolute;top:0;left:37%;right:37%;height:57px;border-bottom:1px solid rgba(221,224,227,.20);border-radius:0 0 50% 50%;box-shadow:inset 0 -12px 16px rgba(0,0,0,.48)}.ws-vest-seam{position:absolute;top:99px;bottom:26px;width:1px;background:linear-gradient(transparent,rgba(215,218,221,.18),rgba(215,218,221,.08),transparent)}.ws-vest-seam-left{left:20%;transform:rotate(1.8deg)}.ws-vest-seam-right{right:20%;transform:rotate(-1.8deg)}
          .ws-vest-yoke{position:relative;z-index:2;margin:0 auto 15px;max-width:230px;padding:8px 7px 7px;border:1px solid rgba(197,201,205,.22);border-radius:3px;background:linear-gradient(#151719,#0a0b0c);font:600 9px/1 'Oswald',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#b8bdc3;box-shadow:0 5px 12px rgba(0,0,0,.42)}.principal .ws-vest-yoke,.founder .ws-vest-yoke{border-color:rgba(214,177,92,.43);color:#d7b66d}
          .ws-vest-duty{position:relative;z-index:2;padding:16px 14px;text-align:left;background:rgba(4,5,6,.42);border-top:1px solid rgba(220,222,224,.10);border-bottom:1px solid rgba(0,0,0,.7);font:400 14.5px/1.5 'EB Garamond',Georgia,serif;color:#eeeae2;text-shadow:0 1px 2px #000}
          .ws-officer-base{position:relative;width:84%;margin:-8px auto 0;padding:13px 14px 12px;border:1px solid rgba(198,202,206,.31);border-radius:3px 3px 8px 8px;background:linear-gradient(180deg,#181a1c,#08090a);box-shadow:0 12px 20px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.07);font:700 15px/1.2 'Cinzel',serif;letter-spacing:.025em;color:#f5f3ed}.principal .ws-officer-base,.founder .ws-officer-base{border-color:rgba(211,176,94,.62)}.ws-officer-base.vacancy{color:#aeb3b8;font-style:italic}
          .ws-officer-card.lead-card .ws-vest-shell{min-height:500px;padding-top:122px}.ws-officer-card.lead-card .ws-office-en{font-size:21px}.ws-officer-card.lead-card .ws-office-gr{font-size:20px}.ws-officer-card.lead-card .ws-vest-duty{font-size:15px;line-height:1.55}.ws-officer-card.founder .ws-officer-base{box-shadow:0 12px 22px rgba(0,0,0,.5),0 0 18px rgba(192,148,58,.12),inset 0 1px rgba(255,255,255,.08)}
          @media(max-width:1180px){.ws-principal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ws-additional-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:820px){.ws-leadership-row{grid-template-columns:1fr;max-width:520px}.ws-principal-grid,.ws-additional-grid{grid-template-columns:1fr;max-width:540px;margin-left:auto;margin-right:auto}.ws-group-title{flex-direction:column;align-items:flex-start;gap:5px}.ws-vest-shell{min-height:420px}.ws-officer-card.lead-card .ws-vest-shell{min-height:440px}}
          </style>
          '''
          style_re = re.compile(r'<style id="ws-officers-vest-graph-style">.*?</style>', re.S)
          if style_re.search(s):
              s = style_re.sub(css.strip(), s, count=1)
          else:
              # Remove prior officer-specific style blocks to avoid conflicts.
              s = re.sub(r'<style id="officer-vest-style-2026">.*?</style>', '', s, flags=re.S)
              s = re.sub(r'<style id="officer-vest-order-style">.*?</style>', '', s, flags=re.S)
              head_end = s.find('</head>')
              if head_end < 0: raise SystemExit('head end not found')
              s = s[:head_end] + css + '\n' + s[head_end:]

          path.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-final-officers-vest-graph.yml
      - name: Commit and push final officers graph
        run: |
          git config user.name "Dimitrios Skiadopoulos"
          git config user.email "grand.chancellor@nglgreece.gr"
          git add -A
          git commit -m "Apply final leather vest officers graph"
          git push origin HEAD:claude/repo-push-vfylka