name: Verify live Chapter Hellas gallery
on:
  push:
    paths:
      - '.github/workflows/apply-gallery-live-fix.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live page and all three deployed photos
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 'https://dskiad.github.io/WSHellas/?v=2ff6ecae' -o /tmp/page.html
          grep -q 'chapter-hellas-road-1-v2.jpg?v=20260906d' /tmp/page.html
          grep -q 'chapter-hellas-road-2-v2.jpg?v=20260906d' /tmp/page.html
          grep -q 'chapter-hellas-road-3-v2.jpg?v=20260906d' /tmp/page.html
          for i in 1 2 3; do
            curl -fsSL --retry 5 --retry-delay 3 "https://dskiad.github.io/WSHellas/assets/chapter-hellas-road-${i}-v2.jpg?v=20260906d" -o "/tmp/live-${i}.jpg"
          done
          python - <<'PY'
          from pathlib import Path
          expected={1:23320,2:24038,3:22774}
          for i,size in expected.items():
              p=Path(f'/tmp/live-{i}.jpg')
              b=p.read_bytes()
              assert len(b)==size, (p, len(b), size)
              assert b[:2]==b'\xff\xd8', (p,'bad JPEG start')
              assert b[-2:]==b'\xff\xd9', (p,'bad JPEG end')
              print(f'LIVE PHOTO {i}: OK, {len(b)} bytes')
          PY
          file /tmp/live-1.jpg /tmp/live-2.jpg /tmp/live-3.jpg
