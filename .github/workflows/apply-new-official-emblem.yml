name: Apply new official Chapter Hellas emblem
on:
  push:
    paths:
      - '.github/workflows/apply-new-official-emblem.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Replace standalone emblems but preserve metallic hero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new_src='assets/widows-sons-mra-chapter-hellas-emblem.jpg'

          targets=[
              'Chapter Hellas emblem',
              'Widows Sons Chapter Hellas full emblem with rockers',
          ]

          changed=0
          for alt in targets:
              pattern=re.compile(r'(<img\b[^>]*?src=["\'])([^"\']+)(["\'][^>]*?alt=["\']'+re.escape(alt)+r'["\'][^>]*>)',re.I|re.S)
              s,n=pattern.subn(lambda m:m.group(1)+new_src+m.group(3),s,count=1)
              changed+=n
              print(alt, 'replaced', n)

          # Explicit safety check: the metallic hero must remain an embedded data image.
          hero=re.search(r'<img\b[^>]*alt=["\']Widows Sons Chapter Hellas emblem — Masonic Riders Assn\. top rocker, Widows Sons oval, Chapter Hellas bottom rocker["\'][^>]*>',s,re.I|re.S)
          if not hero:
              raise SystemExit('Metallic hero image not found')
          if 'data:image/' not in hero.group(0):
              raise SystemExit('Metallic hero image was unexpectedly changed')

          if changed != 2:
              raise SystemExit(f'Expected 2 emblem replacements, got {changed}')

          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/apply-new-official-emblem.yml
          rm -f .github/workflows/inspect-emblem-images.yml
      - name: Commit new official emblem references
        run: |
          git config user.name "Dimitrios Skiadopoulos"
          git config user.email "grand.chancellor@nglgreece.gr"
          git add -A
          git commit -m "Use new official Chapter Hellas emblem across site"
          git push origin HEAD:claude/repo-push-vfylka