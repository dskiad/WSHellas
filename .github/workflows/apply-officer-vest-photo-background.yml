name: Apply officer vest photo background
on:
  push:
    paths:
      - '.github/workflows/apply-officer-vest-photo-background.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Apply uploaded vest image to officer duty cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''
          <style id="officers-uploaded-vest-background">
          /* Uploaded black leather vest used as the background for officer duties */
          .officers-vest-2026 .vest-back{
            min-height:470px!important;
            padding:92px 42px 46px!important;
            clip-path:none!important;
            background-color:#030303!important;
            background-image:linear-gradient(rgba(0,0,0,.03),rgba(0,0,0,.10)),url('assets/officers-vest-bg.jpg')!important;
            background-repeat:no-repeat!important;
            background-position:center top!important;
            background-size:contain!important;
            box-shadow:none!important;
            border:0!important;
          }
          .officers-vest-2026 .vest-back:before,
          .officers-vest-2026 .vest-back:after{display:none!important;content:none!important}
          .officers-vest-2026 .vest-yoke{
            top:48px!important;
            left:24%!important;
            right:24%!important;
            z-index:3!important;
            background:rgba(8,8,8,.72)!important;
            backdrop-filter:blur(1px);
          }
          .officers-vest-2026 .vest-duty{
            width:72%!important;
            margin:84px auto 0!important;
            padding:16px 14px 14px!important;
            background:rgba(3,3,3,.50)!important;
            border:1px solid rgba(220,220,220,.10)!important;
            border-radius:6px!important;
            box-shadow:0 6px 16px rgba(0,0,0,.28)!important;
            backdrop-filter:blur(1px);
          }
          .officers-vest-2026 .vest-duty>span{color:#d8b76d!important}
          .officers-vest-2026 .vest-duty p{
            color:#f2eee6!important;
            text-shadow:0 1px 3px #000!important;
          }
          @media(max-width:700px){
            .officers-vest-2026 .vest-back{min-height:445px!important;padding:88px 34px 42px!important}
            .officers-vest-2026 .vest-duty{width:76%!important;margin-top:80px!important}
          }
          </style>
          '''

          old = re.compile(r'<style id="officers-uploaded-vest-background">.*?</style>', re.S)
          if old.search(s):
              s = old.sub(css.strip(), s, count=1)
          else:
              pos = s.find('</head>')
              if pos < 0:
                  raise SystemExit('Could not find </head>')
              s = s[:pos] + css + '\n' + s[pos:]

          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-officer-vest-photo-background.yml
      - name: Commit and push
        run: |
          git config user.name "Dimitrios Skiadopoulos"
          git config user.email "grand.chancellor@nglgreece.gr"
          git add -A
          git commit -m "Use uploaded leather vest image for officer duties"
          git push origin HEAD:claude/repo-push-vfylka