name: Apply detailed leather vest officers layout
on:
  push:
    paths:
      - '.github/workflows/apply-officers-vest-layout.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Build detailed officers vest section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          officers = [
              ('President','Πρόεδρος','Dimitrios Skiadopoulos','Ηγείται συνολικά του Chapter και έχει την ανώτατη ευθύνη για τη λειτουργία και την κατεύθυνσή του. Προεδρεύει των συνεδριάσεων, οργανώνει και κατευθύνει τις δραστηριότητες, εκπροσωπεί επίσημα το Chapter και μεριμνά για την πιστή εφαρμογή του Καταστατικού, του Εσωτερικού Κανονισμού και των αποφάσεων του Chapter.',True),
              ('Vice President','Αντιπρόεδρος','Dimitrios Panagakos','Είναι ο δεύτερος στην ιεραρχία και ο άμεσος συνεργάτης του Προέδρου. Υποστηρίζει τον Πρόεδρο στην άσκηση των καθηκόντων του και τον αναπληρώνει πλήρως σε κάθε απουσία ή κώλυμά του. Συνοδεύει τον Πρόεδρο στις επίσημες εκδηλώσεις και συνδράμει στον συντονισμό της διοίκησης του Chapter.',True),
              ('Secretary','Γραμματέας','Nikolaos Markopoulos','Είναι υπεύθυνος για τη διοικητική λειτουργία του Chapter. Τηρεί τα πρακτικά, το μητρώο των μελών, το διοικητικό αρχείο, την επίσημη αλληλογραφία και τις προβλεπόμενες αναφορές. Όλα τα επίσημα έγγραφα του Chapter φέρουν υποχρεωτικά τη σφραγίδα και αποκλειστικά την υπογραφή του Γραμματέα. Μόνο ο Γραμματέας υπογράφει τις κάρτες μελών του Chapter.',True),
              ('Treasurer','Ταμίας','Panagiotis Vlahos','Έχει την ευθύνη της οικονομικής διαχείρισης του Chapter. Διαχειρίζεται τους τραπεζικούς λογαριασμούς, τις συνδρομές, τις εισπράξεις και τις πληρωμές, τηρεί τα οικονομικά βιβλία και τα σχετικά παραστατικά και παρουσιάζει τα προβλεπόμενα οικονομικά στοιχεία και τις αναφορές προς τη διοίκηση.',True),
              ('Sergeant-at-Arms','Υπεύθυνος Τάξης','Marinos Andreas','Είναι υπεύθυνος για την εσωτερική τάξη, την πειθαρχία και την τήρηση των Κανονισμών και των αποφάσεων του Chapter. Επιβλέπει την ορθή συμπεριφορά των μελών, αντιμετωπίζει παραβάσεις ή ζητήματα πειθαρχίας και, όταν απαιτείται, τα αναφέρει και τα κλιμακώνει προς τον Πρόεδρο.',True),
              ('Road Captain','Αρχηγός Αποστολής','Panagiotis Floris','Έχει την κύρια ευθύνη για όλες τις οργανωμένες μοτοσικλετιστικές διαδρομές και αποστολές. Σχεδιάζει τη διαδρομή, τα σημεία στάσης και την πορεία, οργανώνει και ελέγχει τον σχηματισμό και τη μοτοσικλετιστική στήλη και μεριμνά για την πειθαρχία, την ασφάλεια και την ομαλή κίνηση της ομάδας στον δρόμο.',True),
              ('Road Sergeant','Ομαδάρχης',None,'Υποστηρίζει άμεσα τον Road Captain κατά τις οργανωμένες διαδρομές και αποστολές. Επιβλέπει το τμήμα, την ομάδα ή τον σχηματισμό που του ανατίθεται, διατηρεί την επικοινωνία με τον Road Captain και μεριμνά για τις αποστάσεις, την πειθαρχία, τη συνοχή και την ασφάλεια των αναβατών στον δρόμο.',False),
              ('Warden','Έφορος Μελών & Συμμόρφωσης','George Dryllis','Παρακολουθεί τα θέματα που αφορούν τα μέλη, την ιδιότητά τους και τη συμμόρφωσή τους προς το Καταστατικό, τον Εσωτερικό Κανονισμό και τις αποφάσεις του Chapter. Επιβλέπει την ορθή χρήση του γιλέκου, των εμβλημάτων και των διακριτικών και συμβάλλει στην προστασία της περιουσίας και της ταυτότητας του Chapter.',False),
              ('Orator','Σύμβουλος','Andreas Tsounakos','Λειτουργεί ως σύμβουλος του Προέδρου και του Chapter. Συνδράμει στη διαμόρφωση θέσεων και επίσημων παρουσιάσεων, στην επικοινωνία, στις εκδηλώσεις και στη δημόσια εκπροσώπηση, μεριμνώντας ώστε ο λόγος και η παρουσία του Chapter να ανταποκρίνονται στις αρχές και στο κύρος του.',False),
              ('Ambassador','Εκπρόσωπος προς άλλα Motorcycle Clubs','Pantelis Lathiotakis','Εκπροσωπεί το Chapter στις σχέσεις του με άλλα Motorcycle Clubs, Widows Sons Chapters και συναφείς οργανώσεις. Αναπτύσσει και διατηρεί επικοινωνία, συνεργασίες και αδελφικούς δεσμούς και ενημερώνει τη διοίκηση για επαφές, προσκλήσεις και θέματα εξωτερικών σχέσεων.',False),
              ('Almoner','Ελεονόμος Αγαθοεργίας','Pavlos Sarof','Είναι υπεύθυνος για την αγαθοεργία, την κοινωνική μέριμνα και τη φιλανθρωπική δράση του Chapter. Παρακολουθεί περιπτώσεις αδελφών, οικογενειών ή άλλων προσώπων που χρειάζονται βοήθεια, εισηγείται τρόπους υποστήριξης και συντονίζει τις σχετικές αγαθοεργές και φιλανθρωπικές ενέργειες.',False),
              ('Quartermaster','Επιμελητής',None,'Διαχειρίζεται την περιουσία, τον εξοπλισμό και τα υλικά του Chapter. Τηρεί την ευθύνη για τα εμβλήματα, τα patches, τα διακριτικά και κάθε αντικείμενο που ανήκει ή χρησιμοποιείται από το Chapter και μεριμνά για την καταγραφή, την ορθή φύλαξη, τη διάθεση, την παράδοση και την επιστροφή τους.',False),
              ('Master of Ceremonies','Τελετάρχης','Alexandros Epifanis','Είναι υπεύθυνος για το τελετουργικό, το πρωτόκολλο και την επίσημη τάξη των τελετών και εκδηλώσεων του Chapter. Προετοιμάζει τη ροή του προγράμματος, καθοδηγεί τους συμμετέχοντες στις προβλεπόμενες διαδικασίες και συντονίζει την ομαλή και αξιοπρεπή διεξαγωγή κάθε επίσημης τελετής.',False),
              ('Preparing Brother','Δοκιμαστής','Konstantinos Karmalis','Αποτελεί βασικό αξίωμα για την εισδοχή και τη μύηση νέου μέλους. Γνωρίζει και προετοιμάζει τον υποψήφιο, τον καθοδηγεί πριν από την εισδοχή, οργανώνει και επιβλέπει τη δοκιμασία που πρέπει να περάσει πριν κριθεί κατάλληλος να γίνει Widows Son και εισηγείται προς τον Πρόεδρο και τη διοίκηση για την ολοκλήρωση της εισδοχής του.',False),
              ('Event Manager','Υπεύθυνος Εκδηλώσεων',None,'Έχει την ευθύνη για την πρακτική προετοιμασία, οργάνωση και υποστήριξη των εκδηλώσεων του Chapter. Συντονίζει τις ανάγκες χώρου, χρόνου, φιλοξενίας και λειτουργίας της εκδήλωσης και συνδράμει σε οτιδήποτε απαιτηθεί πριν, κατά τη διάρκεια και μετά την εκδήλωση για την ομαλή διεξαγωγή της.',False),
          ]

          # Preserve existing Roadnames when present.
          road_by_name = {}
          for _,_,name,_,_ in officers:
              if not name:
                  continue
              pos = s.find(name)
              if pos < 0:
                  continue
              window = s[pos:pos+3500]
              m = re.search(r'<div class="officer-road">(.*?)</div>', window, flags=re.S)
              if m:
                  text = re.sub(r'<[^>]+>', '', m.group(1)).strip()
                  if text:
                      road_by_name[name] = html.unescape(text)

          def unit(en, gr, name, duty, main, idx, founding=False):
              classes = ['officer-vest-unit']
              if main: classes.append('principal')
              if founding: classes.append('founding')
              display_name = name if name else 'Προς ορισμό'
              road = road_by_name.get(name, '') if name else ''
              out = []
              out.append('      <article class="' + ' '.join(classes) + '">')
              out.append('        <div class="vest-office-title">')
              out.append('          <div class="vest-title-en">' + html.escape(en) + '</div>')
              out.append('          <div class="vest-title-gr">' + html.escape(gr) + '</div>')
              out.append('        </div>')
              out.append('        <div class="vest-back">')
              out.append('          <div class="vest-yoke">' + ('FOUNDING DISTINCTION' if founding else ('PRINCIPAL OFFICER' if main else 'CHAPTER OFFICER')) + '</div>')
              out.append('          <div class="vest-duty"><span>ΚΑΘΗΚΟΝΤΑ &amp; ΑΡΜΟΔΙΟΤΗΤΕΣ</span><p>' + html.escape(duty) + '</p></div>')
              out.append('        </div>')
              out.append('        <div class="vest-nameplate">')
              out.append('          <div class="vest-name">' + html.escape(display_name) + '</div>')
              if road:
                  out.append('          <div class="vest-roadname">Roadname: ' + html.escape(road) + '</div>')
              out.append('        </div>')
              out.append('      </article>')
              return '\n'.join(out)

          parts = [
              '    <div class="officer-vest-grid officers-vest-2026">',
              '      <div class="officer-vest-group founding-group"><b>Ειδική Ιδρυτική Ιδιότητα</b><span>Founding Distinction</span></div>',
              unit('Founding President','Ιδρυτικός Πρόεδρος και Οικιστής','Dimitrios Skiadopoulos','Μόνιμη ειδική ιδρυτική ιδιότητα που αναγνωρίζει τον ιδρυτή και πρώτο Πρόεδρο του Chapter Hellas. Αποτελεί ιστορική και τιμητική διάκριση του Chapter, παραμένει συνδεδεμένη με τον ιδρυτή και δεν αποτελεί ξεχωριστό 16ο αξίωμα στη διοικητική δομή.',False,0,True),
              '      <div class="officer-vest-group"><b>Κύριοι Αξιωματικοί</b><span>Principal Officers</span></div>'
          ]
          for i, data in enumerate(officers[:6], 1):
              parts.append(unit(*data, i))
          parts.append('      <div class="officer-vest-group secondary"><b>Λοιποί Αξιωματικοί</b><span>Additional Officers</span></div>')
          for i, data in enumerate(officers[6:], 7):
              parts.append(unit(*data, i))
          parts.append('    </div>')
          new_grid = '\n'.join(parts)

          admin = s.find('<section id="administration">')
          if admin < 0:
              raise SystemExit('Administration section not found')
          start_candidates = [x for x in [s.find('<div class="officer-grid', admin), s.find('<div class="officer-vest-grid', admin)] if x >= 0]
          if not start_candidates:
              raise SystemExit('Officers grid not found')
          start = min(start_candidates)
          end_candidates = [x for x in [s.find('<div class="const-offices"', start), s.find('</section>', start)] if x >= 0]
          if not end_candidates:
              raise SystemExit('Officers grid end not found')
          end = min(end_candidates)
          s = s[:start] + new_grid + '\n\n' + s[end:]

          section_end = s.find('</section>', admin)
          section = s[admin:section_end]
          section = re.sub(r'<h2>.*?Officers of the Chapter.*?</h2>', '<h2>Officers of the Chapter <span style="color:var(--steel);font-size:.7em;">/ Αξιωματικοί του Chapter</span></h2>', section, count=1, flags=re.S)
          leads = list(re.finditer(r'<p class="lead"[^>]*>.*?</p>', section, flags=re.S))
          if leads:
              first = leads[0]
              intro = '<p class="lead">The Chapter is administered by <b>15 officers</b>. The first six are the <b>Principal Officers — Κύριοι Αξιωματικοί</b>. The <b>Founding President — Ιδρυτικός Πρόεδρος και Οικιστής</b> is a permanent special founding distinction and is not counted as a separate office.</p>'
              section = section[:first.start()] + intro + section[first.end():]
          s = s[:admin] + section + s[section_end:]

          style = r'''
          <style id="officer-vest-style-2026">
          .officer-vest-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:38px 28px;margin-top:30px;align-items:start}
          .officer-vest-group{grid-column:1/-1;display:flex;align-items:end;justify-content:space-between;gap:20px;padding:14px 2px 10px;border-bottom:1px solid rgba(198,162,92,.68);font-family:'Cinzel',serif;color:var(--gold-bright,#d6b56d)}
          .officer-vest-group b{font-size:21px;letter-spacing:.035em}.officer-vest-group span{font:600 11px/1.2 'Oswald',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--steel,#b8bec7)}
          .officer-vest-group.secondary{margin-top:16px;border-color:rgba(180,180,180,.24);color:#ece9df}.officer-vest-group.founding-group{border-color:rgba(212,177,95,.9)}
          .officer-vest-unit{position:relative;text-align:center;filter:drop-shadow(0 20px 22px rgba(0,0,0,.42));padding:0 4px 8px}
          .vest-office-title{min-height:82px;display:flex;flex-direction:column;justify-content:end;align-items:center;margin-bottom:8px;padding:10px 12px 8px}
          .vest-title-en{font:700 18px/1.12 'Cinzel',serif;letter-spacing:.055em;text-transform:uppercase;color:#f0f1f2;text-shadow:0 2px 7px #000}
          .vest-title-gr{margin-top:5px;font:600 18px/1.15 'EB Garamond',serif;color:#c8cdd3}
          .officer-vest-unit.principal .vest-title-en,.officer-vest-unit.founding .vest-title-en{color:var(--gold-bright,#e0bd72)}
          .vest-back{position:relative;min-height:445px;padding:92px 42px 48px;overflow:hidden;clip-path:polygon(18% 0,34% 0,39% 7%,44% 12%,56% 12%,61% 7%,66% 0,82% 0,100% 19%,94% 100%,6% 100%,0 19%);background:radial-gradient(ellipse at 24% 18%,rgba(255,255,255,.095),transparent 22%),radial-gradient(ellipse at 78% 42%,rgba(255,255,255,.045),transparent 26%),repeating-linear-gradient(104deg,rgba(255,255,255,.015) 0 1px,rgba(0,0,0,.02) 1px 4px),linear-gradient(100deg,#090a0b 0%,#17191b 31%,#090a0b 50%,#1a1b1d 69%,#08090a 100%);box-shadow:inset 0 0 0 1px rgba(226,226,226,.17),inset 0 0 35px rgba(0,0,0,.82)}
          .vest-back:before{content:'';position:absolute;inset:15px 18px 17px;border:1px dashed rgba(212,214,215,.20);clip-path:polygon(17% 0,33% 0,38% 7%,43% 12%,57% 12%,62% 7%,67% 0,83% 0,100% 19%,94% 100%,6% 100%,0 19%);pointer-events:none}
          .vest-back:after{content:'';position:absolute;left:14%;right:14%;top:78px;height:1px;background:linear-gradient(90deg,transparent,rgba(225,225,225,.28),transparent);box-shadow:0 6px 0 rgba(0,0,0,.35);pointer-events:none}
          .officer-vest-unit.principal .vest-back{background:radial-gradient(ellipse at 24% 18%,rgba(225,190,112,.11),transparent 22%),radial-gradient(ellipse at 78% 42%,rgba(255,255,255,.045),transparent 26%),repeating-linear-gradient(104deg,rgba(255,255,255,.015) 0 1px,rgba(0,0,0,.02) 1px 4px),linear-gradient(100deg,#090a0b 0%,#191816 31%,#090a0b 50%,#1b1915 69%,#08090a 100%)}
          .officer-vest-unit.founding .vest-back{background:radial-gradient(ellipse at 24% 18%,rgba(229,191,94,.15),transparent 24%),radial-gradient(ellipse at 78% 42%,rgba(255,255,255,.05),transparent 26%),repeating-linear-gradient(104deg,rgba(255,255,255,.015) 0 1px,rgba(0,0,0,.02) 1px 4px),linear-gradient(100deg,#080909 0%,#1b1812 31%,#080909 50%,#1d1911 69%,#070808 100%)}
          .vest-yoke{position:absolute;top:43px;left:22%;right:22%;padding:8px 6px 7px;border:1px solid rgba(195,198,201,.26);border-radius:3px;background:linear-gradient(#17191b,#0c0d0e);font:600 9.5px/1 'Oswald',sans-serif;letter-spacing:.15em;color:#aeb4bb;text-transform:uppercase;box-shadow:0 4px 10px rgba(0,0,0,.48)}
          .principal .vest-yoke,.founding .vest-yoke{border-color:rgba(211,176,94,.46);color:#d7b66d}
          .vest-duty{position:relative;z-index:2;text-align:left;padding:17px 13px 12px;background:rgba(5,5,6,.42);border-top:1px solid rgba(218,219,220,.12);border-bottom:1px solid rgba(0,0,0,.6);box-shadow:inset 0 12px 24px rgba(255,255,255,.015)}
          .vest-duty>span{display:block;margin-bottom:10px;text-align:center;font:600 10px/1.2 'Oswald',sans-serif;letter-spacing:.13em;color:#c0c5cb;text-transform:uppercase}.vest-duty p{margin:0;font:400 14.5px/1.52 'EB Garamond',Georgia,serif;color:#eeeae1;text-shadow:0 1px 2px #000}
          .principal .vest-duty>span,.founding .vest-duty>span{color:#d8b76d}
          .vest-nameplate{position:relative;width:82%;margin:-8px auto 0;padding:13px 16px 12px;background:linear-gradient(180deg,#181a1c,#090a0b);border:1px solid rgba(200,203,206,.3);border-radius:3px 3px 8px 8px;box-shadow:0 12px 20px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.08)}
          .principal .vest-nameplate,.founding .vest-nameplate{border-color:rgba(209,174,92,.62)}
          .vest-name{font:700 15.5px/1.2 'Cinzel',serif;letter-spacing:.025em;color:#f5f3ed}.vest-roadname{margin-top:5px;font:500 10.5px/1.2 'Oswald',sans-serif;letter-spacing:.08em;color:#aeb3b9}
          .founding{grid-column:2/3}.founding .vest-nameplate{box-shadow:0 12px 22px rgba(0,0,0,.5),0 0 18px rgba(192,148,58,.10),inset 0 1px rgba(255,255,255,.08)}
          @media(max-width:1100px){.officer-vest-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.founding{grid-column:1/-1;width:min(520px,100%);justify-self:center}}
          @media(max-width:700px){.officer-vest-grid{grid-template-columns:1fr;gap:30px}.founding{grid-column:auto;width:auto}.vest-back{min-height:420px;padding:90px 38px 46px}.officer-vest-group{align-items:flex-start;flex-direction:column;gap:5px}.vest-duty p{font-size:15px}}
          </style>
          '''
          style_re = re.compile(r'<style id="officer-vest-style-2026">.*?</style>', flags=re.S)
          if style_re.search(s):
              s = style_re.sub(style.strip(), s, count=1)
          else:
              head_end = s.find('</head>')
              if head_end < 0:
                  raise SystemExit('head end not found')
              s = s[:head_end] + style + '\n' + s[head_end:]

          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-officers-vest-layout.yml
          rm -f .github/workflows/apply-final-officers-2026.yml
      - name: Commit detailed officers vest section
        run: |
          git config user.name "Dimitrios Skiadopoulos"
          git config user.email "grand.chancellor@nglgreece.gr"
          git add -A
          git commit -m "Apply detailed officers leather vest layout"
          git push origin HEAD:claude/repo-push-vfylka