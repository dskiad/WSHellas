name: Apply official emblem preserving decorative hero
on:
  push:
    paths:
      - '.github/workflows/apply-official-emblem-preserve-hero.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Write official emblem image
        shell: bash
        run: |
          python - <<'PY'
          import base64, pathlib
          data = ''''''
          pathlib.Path('assets/official-emblem.jpg').write_bytes(base64.b64decode(data))
          PY
      - name: Replace only official emblem references
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','officers.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              # Replace existing official emblem asset only. Decorative hero image is a separate embedded image and remains untouched.
              s=s.replace('assets/widows-sons-mra-chapter-hellas-emblem.jpg','assets/official-emblem.jpg?v=20260906')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/apply-official-emblem-preserve-hero.yml
          git config user.name 'Dimitrios Skiadopoulos'
          git config user.email 'grand.chancellor@nglgreece.gr'
          git add index.html officers.html assets/official-emblem.jpg .github/workflows/apply-official-emblem-preserve-hero.yml
          git commit -m 'Use new official emblem while preserving decorative hero' || exit 0
          git push origin HEAD:claude/repo-push-vfylka
