name: Apply section numbering and Chapter Hellas gallery
on:
  push:
    paths:
      - '.github/workflows/apply-section-numbering-gallery.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: section-numbering-gallery-edit
      - name: Update website
        run: python .github/scripts/apply-section-numbering-gallery.py
      - name: Commit changes
        run: |
          rm -f .github/workflows/apply-section-numbering-gallery.yml
          rm -f .github/scripts/apply-section-numbering-gallery.py
          git config user.name 'Dimitrios Skiadopoulos'
          git config user.email 'grand.chancellor@nglgreece.gr'
          git add -A
          git commit -m 'Number website sections and add Chapter Hellas photo gallery'
          git push origin HEAD:section-numbering-gallery-edit
