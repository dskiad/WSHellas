name: Finalize Chapter Hellas photo
on:
  push:
    paths:
      - '.github/workflows/finalize-chapter-hellas-photo.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Decode photo and verify intro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          b64 = Path('assets/chapter-hellas-support.jpg.b64')
          if not b64.exists():
              raise SystemExit('staged photo not found')
          raw = base64.b64decode(b64.read_text(encoding='utf-8'), validate=True)
          if not raw.startswith(b'\xff\xd8'):
              raise SystemExit('decoded file is not JPEG')
          Path('assets/chapter-hellas-support.jpg').write_bytes(raw)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="chapter-hellas-intro"' not in s:
              raise SystemExit('Chapter Hellas intro block not found')
          if 'assets/chapter-hellas-support.jpg' not in s:
              raise SystemExit('Chapter Hellas photo reference not found')

          b64.unlink()
          PY
          rm -f .github/workflows/finalize-chapter-hellas-photo.yml
      - name: Commit and push final version
        run: |
          git config user.name "Dimitrios Skiadopoulos"
          git config user.email "grand.chancellor@nglgreece.gr"
          git add -A
          git commit -m "Add Chapter Hellas support photo"
          git push origin HEAD:claude/repo-push-vfylka