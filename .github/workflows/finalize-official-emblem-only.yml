name: Finalize official emblem only
on:
  push:
    paths:
      - '.github/workflows/finalize-official-emblem-only.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Build official emblem asset
        run: |
          cat .tmp/official-emblem-1.b64 .tmp/official-emblem-2.b64 .tmp/official-emblem-3.b64 .tmp/official-emblem-4.b64 | base64 -d > assets/official-emblem.webp
          echo 'aa97780d141c6f05eba7f42db8cf38c490e2644ad270c75762f4be5093b77096  assets/official-emblem.webp' | sha256sum -c -
      - name: Use it only for the official emblem section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="emblem-frame"><img src="assets/widows-sons-mra-chapter-hellas-emblem.jpg" alt="Widows Sons Chapter Hellas full emblem with rockers"></div>'
          new='<div class="emblem-frame"><img src="assets/official-emblem.webp?v=20260906" alt="Widows Sons MRA Chapter Hellas Official Emblem"></div>'
          if old not in s:
              raise SystemExit('Official emblem section target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          if '<a class="brand" href="#home">\n      <img src="assets/widows-sons-mra-chapter-hellas-emblem.jpg"' not in s:
              raise SystemExit('Decorative header emblem was unexpectedly changed')
          if new not in s:
              raise SystemExit('New official emblem was not inserted')
          PY
      - name: Clean temporary files and commit
        run: |
          rm -f .tmp/official-emblem-1.b64 .tmp/official-emblem-2.b64 .tmp/official-emblem-3.b64 .tmp/official-emblem-4.b64
          rm -f .github/workflows/apply-official-emblem-preserve-hero.yml
          rm -f .github/workflows/finalize-official-emblem-only.yml
          git config user.name 'Dimitrios Skiadopoulos'
          git config user.email 'grand.chancellor@nglgreece.gr'
          git add -A
          git commit -m 'Use new official emblem while preserving decorative header'
          git push origin HEAD:claude/repo-push-vfylka
