name: Inspect Chapter Hellas photo staging
on:
  push:
    paths:
      - '.github/workflows/inspect-finalizer-error.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Inspect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          out=[]
          b=Path('assets/chapter-hellas-support.jpg.b64')
          out.append(f'b64_exists={b.exists()}')
          if b.exists():
              t=b.read_text(encoding='utf-8')
              out.append(f'b64_len={len(t)}')
              try:
                  raw=base64.b64decode(t,validate=True)
                  out.append(f'decode_ok=True bytes={len(raw)} jpeg={raw[:2]==bytes([255,216])}')
              except Exception as e:
                  out.append('decode_error='+repr(e))
          s=Path('index.html').read_text(encoding='utf-8')
          out.append(f'intro_id={"id=\"chapter-hellas-intro\"" in s}')
          out.append(f'photo_ref={"assets/chapter-hellas-support.jpg" in s}')
          Path('CHAPTER_INTRO_INSPECT.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name "Dimitrios Skiadopoulos"
          git config user.email "grand.chancellor@nglgreece.gr"
          git add CHAPTER_INTRO_INSPECT.txt
          git commit -m "Inspect Chapter Hellas intro staging"
          git push origin HEAD:claude/repo-push-vfylka