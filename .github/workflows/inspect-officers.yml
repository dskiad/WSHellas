name: Inspect officers section
on:
  push:
    paths:
      - '.github/workflows/inspect-officers.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Print officer title and name pairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          pairs = re.findall(r'<div class="officer-role">(.*?)</div>\s*<div class="officer-name">(.*?)</div>', s, flags=re.S)
          print('COUNT:', len(pairs))
          for i,(role,name) in enumerate(pairs,1):
              clean_role = re.sub(r'<.*?>','',role).strip()
              clean_name = re.sub(r'<.*?>','',name).strip()
              print(f'{i:02d}|{clean_role}|{clean_name}')
          PY