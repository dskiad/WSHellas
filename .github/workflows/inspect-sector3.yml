name: Inspect sector 3 emblem
on:
  push:
    paths:
      - '.github/workflows/inspect-sector3.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspect-sector3-alignment-run2
      - name: Show official emblem context
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needle='official-emblem.webp'
          i=s.find(needle)
          if i<0:
              raise SystemExit('official emblem not found')
          print(s[max(0,i-3000):i+5000])
          PY
