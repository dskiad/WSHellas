name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/repo-push-vfylka]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish final Officers edition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html, re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          officers=[
            ('President','Πρόεδρος','Dimitrios Skiadopoulos','Ηγείται του Chapter, προεδρεύει των συνεδριάσεων, κατευθύνει τη λειτουργία και τις δραστηριότητές του, εκπροσωπεί επίσημα το Chapter και μεριμνά για την εφαρμογή του Καταστατικού και του Εσωτερικού Κανονισμού.',True),
            ('Vice President','Αντιπρόεδρος','Dimitrios Panagakos','Είναι ο άμεσος συνεργάτης του Προέδρου. Τον υποστηρίζει στην άσκηση των καθηκόντων του και τον αναπληρώνει σε κάθε απουσία ή κώλυμά του. Συνοδεύει τον Πρόεδρο στις επίσημες εκδηλώσεις.',True),
            ('Secretary','Γραμματέας','Nikolaos Markopoulos','Είναι υπεύθυνος για τη διοικητική λειτουργία του Chapter. Τηρεί τα πρακτικά, το μητρώο των μελών, το αρχείο, την επίσημη αλληλογραφία και τις διοικητικές αναφορές. Όλα τα επίσημα έγγραφα του Chapter φέρουν τη σφραγίδα και την υπογραφή του. Είναι επίσης υπεύθυνος για την υπογραφή των καρτών μέλους του Chapter.',True),
            ('Treasurer','Ταμίας','Panagiotis Vlahos','Διαχειρίζεται τα οικονομικά του Chapter, τους τραπεζικούς λογαριασμούς, τις συνδρομές, τις εισπράξεις και τις πληρωμές και τηρεί τα προβλεπόμενα οικονομικά αρχεία και στοιχεία.',True),
            ('Sergeant-at-Arms','Αρχιφύλακας','Marinos Andreas','Μεριμνά για την εσωτερική τάξη και πειθαρχία. Επιβλέπει την τήρηση του Κανονισμού και των αποφάσεων του Chapter, αντιμετωπίζει παραβάσεις και αναφέρεται στον Πρόεδρο όταν απαιτείται.',True),
            ('Road Captain','Αρχηγός Αποστολής','Panagiotis Floris','Έχει την κύρια ευθύνη για τις οργανωμένες μοτοσικλετιστικές διαδρομές. Σχεδιάζει τις διαδρομές και τις αποστολές και έχει την ευθύνη της διάταξης, της ασφάλειας και της πορείας της ομάδας στον δρόμο.',True),
            ('Road Sergeant','Ομαδάρχης',None,'Υποστηρίζει τον Road Captain κατά τις διαδρομές. Επιβλέπει το τμήμα ή την ομάδα που του ανατίθεται και μεριμνά για την πειθαρχία, την επικοινωνία και την ασφάλεια του σχηματισμού.',False),
            ('Guardian of Membership','Έφορος Μελών','George Dryllis','Παρακολουθεί τα θέματα που αφορούν τα μέλη, την ιδιότητά τους και τη συμμόρφωσή τους προς τους κανόνες του Chapter. Μεριμνά για την ορθή χρήση των διακριτικών και για την προστασία της ιδιότητας του μέλους.',False),
            ('Master of Ceremonies','Τελετάρχης','Alexandros Epifanis','Είναι υπεύθυνος για το τελετουργικό και το πρωτόκολλο του Chapter. Οργανώνει τις επίσημες τελετές και εκδηλώσεις και συντονίζει την ομαλή εξέλιξη του προγράμματος.',False),
            ('Quartermaster','Επιμελητής',None,'Διαχειρίζεται την περιουσία και τον εξοπλισμό του Chapter, τα υλικά, τα διακριτικά, τα patches και κάθε άλλο αντικείμενο που ανήκει ή χρησιμοποιείται από το Chapter.',False),
            ('Almoner','Ελεονόμος Αγαθοεργίας','Pavlos Sarof','Είναι υπεύθυνος για την αγαθοεργία και την κοινωνική μέριμνα του Chapter. Παρακολουθεί περιπτώσεις αδελφών ή άλλων προσώπων που χρειάζονται βοήθεια και συντονίζει τις σχετικές φιλανθρωπικές ενέργειες.',False),
            ('Ambassador','Πρέσβης','Pantelis Lathiotakis','Εκπροσωπεί το Chapter στις σχέσεις του με άλλα Motorcycle Clubs, Chapters και συναφείς οργανώσεις. Αναπτύσσει επικοινωνία, συνεργασίες και αδελφικούς δεσμούς.',False),
            ('Orator','Σύμβουλος','Andreas Tsounakos','Συμβουλεύει τον Πρόεδρο και το Chapter και συνδράμει στην επικοινωνία, στις επίσημες παρουσιάσεις, στις εκδηλώσεις και στη δημόσια εκπροσώπηση του Chapter.',False),
            ('Preparing Brother','Δοκιμαστής','Konstantinos Karmalis','Βασικό αξίωμα για την εισδοχή και τη μύηση νέου μέλους. Γνωρίζει και προετοιμάζει τον υποψήφιο, οργανώνει και επιβλέπει τη δοκιμασία που πρέπει να περάσει πριν κριθεί κατάλληλος να γίνει Widows Son και εισηγείται σχετικά για την ολοκλήρωση της εισδοχής του.',False),
            ('Steward','Επίτροπος Φιλοξενίας',None,'Μεριμνά για τη φιλοξενία των μελών και των επισκεπτών στις συναντήσεις και στις εκδηλώσεις του Chapter. Υποστηρίζει την πρακτική οργάνωση των εκδηλώσεων και βοηθά σε οτιδήποτε χρειαστεί για την ομαλή διεξαγωγή τους.',False),
          ]

          roads={}
          for _,_,name,_,_ in officers:
            if not name: continue
            m=f'<div class="officer-name">{name}</div>'; pos=s.find(m)
            if pos<0: continue
            a=s.find('<div class="officer-road">',pos)
            if a>=0 and a-pos<3000:
              b=s.find('</div>',a)
              if b>=0: roads[name]=s[a:b+6]

          def card(en,gr,name,duty,principal=False,lead=False):
            cls='officer-card patch'+(' main-officer' if principal else '')+(' lead' if lead else '')
            nm=html.escape(name) if name else 'Προς ορισμό'
            ncls='officer-name'+('' if name else ' vacant')
            return f'<div class="{cls}"><span class="rivet"></span><span class="rivet"></span><span class="rivet"></span><span class="rivet"></span><div class="officer-role">{html.escape(en)}</div><div class="officer-title-gr">{html.escape(gr)}</div><div class="{ncls}">{nm}</div><div class="officer-duty"><span>Ρόλος</span>{html.escape(duty)}</div>{roads.get(name,"") if name else ""}</div>'

          grid=['<div class="officer-grid officers-2026">','<div class="officer-group-title founding"><b>Ειδική Ιδρυτική Ιδιότητα</b><span>Founding Distinction</span></div>',f'<div class="officer-card patch founding-president lead"><span class="rivet"></span><span class="rivet"></span><span class="rivet"></span><span class="rivet"></span><div class="officer-role">Founding President</div><div class="officer-title-gr">Ιδρυτικός Πρόεδρος και Οικιστής</div><div class="officer-name">Dimitrios Skiadopoulos</div><div class="officer-duty"><span>Ιδρυτική Ιδιότητα</span>Ειδική και μόνιμη ιδρυτική διάκριση του Chapter. Δεν αποτελεί ξεχωριστό 16ο αξίωμα.</div>{roads.get("Dimitrios Skiadopoulos","")}</div>','<div class="officer-group-title"><b>Κύριοι Αξιωματικοί</b><span>Principal Officers</span></div>']
          for i,x in enumerate(officers[:6]): grid.append(card(*x,lead=(i==0)))
          grid.append('<div class="officer-group-title secondary"><b>Λοιποί Αξιωματικοί</b><span>Additional Officers</span></div>')
          for x in officers[6:]: grid.append(card(*x))
          grid.append('</div>')
          newgrid=''.join(grid)
          admin=s.find('<section id="administration">')
          if admin<0: raise SystemExit('administration section missing')
          start=s.find('<div class="officer-grid',admin)
          if start<0: raise SystemExit('officer grid missing')
          end_candidates=[x for x in (s.find('<div class="const-offices"',start),s.find('</section>',start)) if x>=0]
          if not end_candidates: raise SystemExit('officer grid end missing')
          s=s[:start]+newgrid+s[min(end_candidates):]

          # Add Officers beside the existing Dress Code action, preserving its classes/style.
          if 'href="officers.html"' not in s and "href='officers.html'" not in s:
            choices=[]
            for m in re.finditer(r'Dress\s*Code',s,re.I):
              a=s.rfind('<a',0,m.start()); b=s.find('</a>',m.end())
              if a<0 or b<0 or m.start()-a>1600: continue
              tag=s[a:b+4]; near=s[max(0,a-2500):min(len(s),b+2500)]
              score=(5 if re.search('Constitution',near,re.I) else 0)+(5 if re.search(r'By[- ]?Laws',near,re.I) else 0)
              choices.append((score,b,tag))
            if choices:
              _,b,tag=max(choices,key=lambda x:x[0])
              oe=tag.find('>'); opening=tag[:oe+1]; inner=tag[oe+1:-4]
              opening=re.sub(r'href\s*=\s*(["\']).*?\1','href="officers.html"',opening,count=1,flags=re.S|re.I)
              if 'href="officers.html"' not in opening: opening=opening[:-1]+' href="officers.html">'
              inner=re.sub(r'Dress\s*Code','Officers',inner,flags=re.I)
              if 'Officers' not in inner: inner='Officers'
              s=s[:b+4]+opening+inner+'</a>'+s[b+4:]

          p.write_text(s,encoding='utf-8')

          founding=('Founding President','Ιδρυτικός Πρόεδρος και Οικιστής','Dimitrios Skiadopoulos','Ειδική και μόνιμη ιδρυτική διάκριση του Chapter. Δεν αποτελεί ξεχωριστό 16ο αξίωμα.','founding')
          data=[founding]+[(a,b,c,d,'principal' if e else 'additional') for a,b,c,d,e in officers]
          def vest(x):
            en,gr,name,duty,kind=x; name=name or 'Προς ορισμό'; badge='Founding Distinction' if kind=='founding' else ('Principal Officer' if kind=='principal' else 'Chapter Officer')
            return f'''<article class="officer {kind}"><header class="rank"><b>{html.escape(en)}</b><span>{html.escape(gr)}</span></header><div class="vest"><div class="seam"></div><div class="vest-role">{html.escape(gr)}</div><p>{html.escape(duty)}</p><small>WIDOWS SONS · CHAPTER HELLAS</small></div><footer class="nameplate"><b>{html.escape(name)}</b><span>{badge}</span></footer></article>'''
          cards=''.join(vest(x) for x in data)
          page=f'''<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Αξιωματικοί | Widows Sons Chapter Hellas</title><style>
          *{{box-sizing:border-box}}body{{margin:0;background:radial-gradient(circle at 50% -8%,#30343a,#111315 38%,#050607 78%);color:#eee;font-family:Arial,sans-serif}}body:before{{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(115deg,transparent 0 9px,#fff 10px,transparent 11px 20px)}}.top{{max-width:1280px;margin:auto;padding:28px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px}}.back{{color:#ddd;text-decoration:none;border:1px solid #555b62;background:#0b0d0f;padding:10px 15px;text-transform:uppercase;letter-spacing:.12em;font-size:11px}}.brand{{font-size:10px;letter-spacing:.3em;color:#aeb4bc;text-transform:uppercase}}.cover{{text-align:center;max-width:1140px;margin:auto;padding:8px 22px 42px;border-bottom:1px solid #333}}.logo{{height:180px;display:grid;place-items:center;margin:auto auto 12px}}#chapterLogo{{max-height:180px;max-width:210px;display:none;filter:drop-shadow(0 10px 16px #000)}}#fallback{{font:800 54px Georgia;color:#c8cbd0}}h1{{font:700 clamp(48px,8vw,90px)/1 Georgia,serif;margin:10px 0;text-transform:uppercase;letter-spacing:.06em;text-shadow:0 3px #000}}.cover p{{font:18px/1.6 Georgia,serif;color:#b7bbc0;margin:auto;max-width:780px}}.badges{{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}}.badges span{{font-size:10px;letter-spacing:.13em;text-transform:uppercase;border:1px solid #454a50;padding:8px 11px;background:#0c0e10;color:#c9cdd2}}.grid{{max-width:1280px;margin:50px auto 80px;padding:0 22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 28px}}.officer{{text-align:center}}.rank{{min-height:78px;display:flex;flex-direction:column;justify-content:end;margin-bottom:12px;text-transform:uppercase}}.rank b{{font:700 20px Georgia,serif;letter-spacing:.07em}}.rank span{{font-size:12px;letter-spacing:.1em;color:#aeb4ba;margin-top:6px}}.vest{{position:relative;min-height:450px;padding:115px 50px 78px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(103deg,#030303,#252525 11%,#090909 28%,#1a1a1a 50%,#080808 70%,#222 89%,#030303);clip-path:polygon(18% 0,37% 8%,63% 8%,82% 0,100% 15%,88% 35%,91% 100%,9% 100%,12% 35%,0 15%);filter:drop-shadow(0 18px 18px #000);border-radius:18px}}.vest:before{{content:"";position:absolute;inset:14px 12px 16px;border:1px dashed #575b60;clip-path:inherit}}.vest:after{{content:"";position:absolute;top:8px;left:50%;width:23%;height:72px;transform:translateX(-50%);border:2px solid #555;border-top:0;border-radius:0 0 52% 52%;background:#080808}}.seam{{position:absolute;top:85px;bottom:30px;left:50%;border-left:1px dashed #333}}.vest-role{{z-index:2;font:700 16px Georgia,serif;text-transform:uppercase;letter-spacing:.07em;margin-bottom:18px;color:#d9dce0}}.vest p{{z-index:2;font:14px/1.56 Georgia,serif;color:#eee9df;max-width:285px;margin:0;text-shadow:0 1px 2px #000}}.vest small{{position:absolute;z-index:2;bottom:47px;font-size:8px;letter-spacing:.22em;color:#777c82}}.nameplate{{width:84%;margin:-7px auto 0;background:linear-gradient(#22252a,#090a0c);border:1px solid #4c5157;border-top:3px solid #aeb4bb;padding:13px;box-shadow:0 13px 22px #000}}.nameplate b{{display:block;font:700 18px Georgia,serif}}.nameplate span{{display:block;margin-top:5px;color:#9298a0;font-size:9px;letter-spacing:.18em;text-transform:uppercase}}.founding .rank b{{color:#d6c184}}.founding .nameplate{{border-top-color:#c4ad6a}}.founding .vest:before{{border-color:#8f7b4b}}@media(max-width:980px){{.grid{{grid-template-columns:repeat(2,1fr)}}}}@media(max-width:640px){{.grid{{grid-template-columns:1fr;max-width:430px;padding:0 15px}}.brand{{display:none}}.vest{{min-height:425px}}}}
          </style></head><body><nav class="top"><a class="back" href="index.html">← Chapter Hellas</a><span class="brand">Widows Sons Masonic Riders Association</span></nav><header class="cover"><div class="logo"><img id="chapterLogo" alt="Chapter Hellas emblem"><div id="fallback">WS</div></div><div class="brand">Official Chapter Officers · 2026</div><h1>Αξιωματικοί</h1><p>Widows Sons Masonic Riders Association — Chapter Hellas<br>Η επίσημη διάρθρωση των Αξιωματικών, οι τίτλοι τους και οι αρμοδιότητές τους.</p><div class="badges"><span>Founding President · Ιδρυτικός Πρόεδρος και Οικιστής</span><span>6 Principal Officers</span><span>15 Offices</span></div></header><main class="grid">{cards}</main><script>(async()=>{{try{{const t=await fetch('index.html',{{cache:'no-store'}}).then(r=>r.text());const d=new DOMParser().parseFromString(t,'text/html');let img=d.querySelector('#emblem img');if(!img)img=[...d.images].find(i=>/emblem|chapter hellas|widows sons|logo/i.test((i.alt||'')+' '+(i.id||'')+' '+(i.className||'')));if(img&&img.src){{chapterLogo.src=img.src;chapterLogo.style.display='block';fallback.style.display='none'}}}}catch(e){{}}}})()</script></body></html>'''
          Path('officers.html').write_text(page,encoding='utf-8')
          PY
          git config user.name "Dimitrios Skiadopoulos"
          git config user.email "grand.chancellor@nglgreece.gr"
          git add index.html officers.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish final Officers page and navigation"
            git push origin HEAD:claude/repo-push-vfylka
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
