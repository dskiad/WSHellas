name: Rebuild Chapter Hellas gallery v2
on:
  push:
    paths:
      - '.github/workflows/rebuild-gallery-v2.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Rebuild gallery JPEGs
        run: |
          set -euo pipefail
          tr -cd 'A-Za-z0-9+/=\n' < .tmp/galleryfix-road1.b64 | base64 -d > assets/chapter-hellas-road-1-v2.jpg
          cat .tmp/galleryfix-road2a.b64 .tmp/galleryfix-road2b.b64 | tr -cd 'A-Za-z0-9+/=\n' | base64 -d > assets/chapter-hellas-road-2-v2.jpg
          cat .tmp/galleryfix-road3a.b64 .tmp/galleryfix-road3b.b64 | tr -cd 'A-Za-z0-9+/=\n' | base64 -d > assets/chapter-hellas-road-3-v2.jpg
          python - <<'PY'
          from pathlib import Path
          for name in ('assets/chapter-hellas-road-1-v2.jpg','assets/chapter-hellas-road-2-v2.jpg','assets/chapter-hellas-road-3-v2.jpg'):
              p=Path(name); b=p.read_bytes()
              if len(b) < 5000 or b[:2] != bytes([255,216]) or bytes([255,217]) not in b[-32:]:
                  raise SystemExit(f'Invalid JPEG: {name}, {len(b)} bytes')
              print(name, len(b), 'OK')
          PY
          file assets/chapter-hellas-road-1-v2.jpg assets/chapter-hellas-road-2-v2.jpg assets/chapter-hellas-road-3-v2.jpg
      - name: Update gallery references
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('assets/chapter-hellas-road-1.jpg?v=20260906','assets/chapter-hellas-road-1-v2.jpg?v=20260906c'),
            ('assets/chapter-hellas-road-2.jpg?v=20260906','assets/chapter-hellas-road-2-v2.jpg?v=20260906c'),
            ('assets/chapter-hellas-road-3.jpg?v=20260906','assets/chapter-hellas-road-3-v2.jpg?v=20260906c')]
          for old,new in pairs:
              if old not in s: raise SystemExit('Missing '+old)
              s=s.replace(old,new)
          a=s.find('<!-- chapter-hellas-gallery:start -->'); b=s.find('<!-- chapter-hellas-gallery:end -->',a)
          block=s[a:b].replace(' loading="lazy"',' loading="eager"')
          s=s[:a]+block+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit gallery fix
        run: |
          rm -f .github/workflows/rebuild-gallery-v2.yml
          rm -rf .tmp
          git config user.name 'Dimitrios Skiadopoulos'
          git config user.email 'grand.chancellor@nglgreece.gr'
          git add -A
          git commit -m 'Rebuild and publish validated Chapter Hellas gallery photos'
          git push origin HEAD:claude/repo-push-vfylka
