name: Refresh real vest selector cache
on:
  push:
    paths:
      - '.github/workflows/refresh-real-vest-selector.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Refresh stylesheet version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html','officers.html'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('assets/officer-vest-background.css?v=202609060405','assets/officer-vest-background.css?v=202609060415')
              p.write_text(s,encoding='utf-8')
          Path('.github/workflows/refresh-real-vest-selector.yml').unlink(missing_ok=True)
          PY
      - name: Commit and push
        run: |
          git config user.name "Dimitrios Skiadopoulos"
          git config user.email "grand.chancellor@nglgreece.gr"
          git add -A
          git commit -m "Force real vest background on officer descriptions"
          git push origin HEAD:claude/repo-push-vfylka