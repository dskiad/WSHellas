name: Remove Dress Code section
on:
  push:
    paths:
      - '.github/workflows/remove-dress-code-section.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Remove entire Dress Code sector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          section_re = re.compile(r'<section\b[^>]*>.*?</section>', re.I | re.S)
          target = None
          section_id = None

          for m in section_re.finditer(s):
              block = m.group(0)
              plain = re.sub(r'<[^>]+>', ' ', block)
              plain = re.sub(r'\s+', ' ', plain).strip().lower()
              if (
                  'vest & patch regulations' in plain
                  or 'vest &amp; patch regulations' in block.lower()
                  or '06 — dress code' in plain
                  or '06 - dress code' in plain
                  or 'ενδυματολογικός κώδικας' in plain
                  or 'ενδυματολογικος κωδικας' in plain
              ):
                  target = m
                  idm = re.search(r'\bid=["\']([^"\']+)["\']', block, re.I)
                  section_id = idm.group(1) if idm else None
                  break

          if target is None:
              raise SystemExit('Dress Code section not found')

          s = s[:target.start()] + s[target.end():]

          # Remove any navigation link pointing to the deleted section.
          if section_id:
              s = re.sub(
                  rf'\s*<a\b[^>]*href=["\']#{re.escape(section_id)}["\'][^>]*>.*?</a>',
                  '',
                  s,
                  flags=re.I | re.S,
              )

          # Fallback cleanup for a nav link named Dress Code even if the section had no id.
          s = re.sub(
              r'\s*<a\b[^>]*href=["\']#[^"\']+["\'][^>]*>\s*(?:06\s*[—-]\s*)?Dress\s*Code\s*</a>',
              '',
              s,
              flags=re.I | re.S,
          )

          p.write_text(s, encoding='utf-8')

          # Keep README aligned with the live site's sections.
          r = Path('README.md')
          if r.exists():
              t = r.read_text(encoding='utf-8')
              t = re.sub(r'^\|\s*Dress Code\s*\|.*\|\s*$', '', t, flags=re.I | re.M)
              t = re.sub(r'\n### Vest Configurator\n\n.*?(?=\n### |\Z)', '\n', t, flags=re.I | re.S)
              t = re.sub(r'\n{3,}', '\n\n', t)
              r.write_text(t.strip() + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/remove-dress-code-section.yml
      - name: Commit and push removal
        run: |
          git config user.name "Dimitrios Skiadopoulos"
          git config user.email "grand.chancellor@nglgreece.gr"
          git add -A
          git commit -m "Remove Dress Code and vest regulations section"
          git push origin HEAD:claude/repo-push-vfylka