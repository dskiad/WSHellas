name: Repair Chapter Hellas gallery photos
on:
  push:
    paths:
      - '.github/workflows/repair-chapter-gallery.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Rebuild valid JPEG gallery assets
        run: |
          base64 -d .tmp/galleryfix-road1.b64 > assets/chapter-hellas-road-1.jpg
          cat .tmp/galleryfix-road2a.b64 .tmp/galleryfix-road2b.b64 | base64 -d > assets/chapter-hellas-road-2.jpg
          cat .tmp/galleryfix-road3a.b64 .tmp/galleryfix-road3b.b64 | base64 -d > assets/chapter-hellas-road-3.jpg
          echo '015da91cbb461fb4cc4f98f2c16db58b4de584f7f9fc6c3f3e46e404980c676b  assets/chapter-hellas-road-1.jpg' | sha256sum -c -
          echo '4682d2269cf98b3091989854307647bdd6003300b7d9aa42919b9fae923ee558  assets/chapter-hellas-road-2.jpg' | sha256sum -c -
          echo 'b2002b9284b9ba489ac820de3991eadcaf91e58541d0f80112ab26f6465f255a  assets/chapter-hellas-road-3.jpg' | sha256sum -c -
          file assets/chapter-hellas-road-1.jpg assets/chapter-hellas-road-2.jpg assets/chapter-hellas-road-3.jpg
      - name: Clean temporary repair files and commit
        run: |
          rm -f .tmp/repair-road1.b64
          rm -f .tmp/galleryfix-road1.b64 .tmp/galleryfix-road2a.b64 .tmp/galleryfix-road2b.b64 .tmp/galleryfix-road3a.b64 .tmp/galleryfix-road3b.b64
          rm -f .github/workflows/repair-chapter-gallery.yml
          git config user.name 'Dimitrios Skiadopoulos'
          git config user.email 'grand.chancellor@nglgreece.gr'
          git add -A
          git commit -m 'Repair Chapter Hellas gallery photos'
          git push origin HEAD:claude/repo-push-vfylka
