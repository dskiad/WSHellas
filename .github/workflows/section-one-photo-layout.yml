name: Refine Section 01 photos and locator labels
on:
  push:
    paths:
      - '.github/workflows/section-one-photo-layout.yml'
      - '.tmp/section-one-update.py'
      - '.tmp/chapter-ph1-0.b64'
      - '.tmp/chapter-ph1-1.b64'
      - '.tmp/chapter-ph1-2.b64'
      - '.tmp/chapter-ph1-3.b64'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/repo-push-vfylka
      - name: Build and validate new Section 01 photo
        run: |
          set -euo pipefail
          cat .tmp/chapter-ph1-0.b64 .tmp/chapter-ph1-1.b64 .tmp/chapter-ph1-2.b64 .tmp/chapter-ph1-3.b64 | base64 -d > assets/chapter-hellas-ph-1-20260906.jpg
          echo 'd9e75eef7f1b26d52a1d43a2013122b9109c0a08e8df315c7618edae089eb992  assets/chapter-hellas-ph-1-20260906.jpg' | sha256sum -c -
          file assets/chapter-hellas-ph-1-20260906.jpg
      - name: Update Section 01 layout
        run: python .tmp/section-one-update.py
      - name: Commit and push
        run: |
          rm -f .github/workflows/section-one-photo-layout.yml
          rm -rf .tmp
          git config user.name 'Dimitrios Skiadopoulos'
          git config user.email 'grand.chancellor@nglgreece.gr'
          git add -A
          git commit -m 'Redesign Section 01 photo pair and locator labels'
          git push origin HEAD:claude/repo-push-vfylka
